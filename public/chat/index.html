<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Echo · 私语</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --washi: #efe9dc;
  --washi-dark: #e4dccb;
  --ink: #27221c;
  --ink-soft: #5a4e46;
  --vermillion: #a7372a;
  --vermillion-soft: #c4564a;
  --echo-bg: #f7f3ec;
  --joy-bg: #a7372a;
  --joy-text: #faf5ef;
  --shadow: rgba(44, 36, 32, 0.08);
  --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

html, body {
  height: 100%; width: 100%;
  background: var(--washi);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Auth Screen ── */
#auth-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 2rem;
  text-align: center;
}
#auth-screen .seal {
  width: 48px; height: 48px;
  border: 2px solid var(--vermillion);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 22px;
  color: var(--vermillion);
  margin-bottom: 1.5rem;
  transform: rotate(-4deg);
}
#auth-screen h1 {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  color: var(--ink);
  margin-bottom: 0.4rem;
}
#auth-screen .sub {
  font-size: 0.75rem;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
  margin-bottom: 2rem;
}
#auth-screen input {
  width: 100%; max-width: 260px;
  padding: 0.7rem 1rem;
  border: 1px solid var(--washi-dark);
  border-radius: 8px;
  background: var(--echo-bg);
  font-size: 0.9rem;
  text-align: center;
  letter-spacing: 0.2em;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
#auth-screen input:focus { border-color: var(--vermillion-soft); }
#auth-screen button {
  margin-top: 1rem;
  padding: 0.6rem 2.5rem;
  background: var(--vermillion);
  color: var(--joy-text);
  border: none;
  border-radius: 8px;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: opacity 0.2s;
}
#auth-screen button:active { opacity: 0.8; }
#auth-screen .err {
  margin-top: 0.8rem;
  font-size: 0.75rem;
  color: var(--vermillion);
}

/* ── Chat Container ── */
#chat-app {
  display: none;
  flex-direction: column;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
}

/* ── Header ── */
.chat-header {
  display: flex;
  align-items: center;
  padding: 0.55rem 0.8rem;
  border-bottom: 1px solid var(--washi-dark);
  background: var(--washi);
  flex-shrink: 0;
  gap: 0.5rem;
}
.chat-header .avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--vermillion);
  color: var(--joy-text);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 13px;
  flex-shrink: 0;
}
.chat-header .name {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  letter-spacing: 0.06em;
}
.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.new-btn {
  padding: 0.25rem 0.55rem;
  font-size: 0.65rem;
  color: var(--ink-soft);
  background: none;
  border: 1px solid var(--washi-dark);
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 0.04em;
  font-family: var(--font-sans);
}
.new-btn:active { background: var(--washi-dark); }

/* ── Toolbar (model + thinking) ── */
.chat-toolbar {
  display: flex;
  align-items: center;
  padding: 0.35rem 0.8rem;
  border-bottom: 1px solid rgba(228,220,203,0.6);
  background: rgba(247,243,236,0.5);
  flex-shrink: 0;
  gap: 0.6rem;
  font-size: 0.72rem;
  color: var(--ink-soft);
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.toolbar-group label {
  font-size: 0.68rem;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.model-select {
  padding: 0.18rem 0.35rem;
  border: 1px solid var(--washi-dark);
  border-radius: 5px;
  background: var(--echo-bg);
  font-size: 0.7rem;
  color: var(--ink);
  font-family: var(--font-sans);
  outline: none;
  cursor: pointer;
  max-width: 140px;
}
.model-select:focus { border-color: var(--vermillion-soft); }

/* Toggle switch */
.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  cursor: pointer;
}
.toggle-track {
  width: 28px; height: 16px;
  border-radius: 8px;
  background: var(--washi-dark);
  position: relative;
  transition: background 0.2s;
}
.toggle-track.on { background: var(--vermillion); }
.toggle-knob {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  position: absolute;
  top: 2px; left: 2px;
  transition: transform 0.2s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.toggle-track.on .toggle-knob { transform: translateX(12px); }

.model-badge {
  display: none;
  font-size: 0.62rem;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  background: rgba(167,55,42,0.1);
  color: var(--vermillion);
  margin-left: auto;
}
.model-badge.show { display: inline; }

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 0.8rem;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.msg {
  display: flex;
  margin-bottom: 0.8rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { justify-content: flex-end; }
.msg.assistant { justify-content: flex-start; }

.bubble {
  max-width: 80%;
  padding: 0.65rem 0.9rem;
  border-radius: 14px;
  font-size: 0.92rem;
  line-height: 1.65;
  word-break: break-word;
  position: relative;
}
.msg.user .bubble {
  background: var(--joy-bg);
  color: var(--joy-text);
  border-bottom-right-radius: 4px;
}
.msg.assistant .bubble {
  background: var(--echo-bg);
  color: var(--ink);
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(44, 36, 32, 0.06);
}

/* Markdown inside bubbles */
.bubble p { margin: 0 0 0.4em 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code {
  background: rgba(44, 36, 32, 0.06);
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.85em;
}
.msg.user .bubble code { background: rgba(255,255,255,0.15); }
.bubble pre {
  background: rgba(44, 36, 32, 0.05);
  padding: 0.5rem;
  border-radius: 6px;
  overflow-x: auto;
  margin: 0.3em 0;
}
.bubble blockquote {
  border-left: 2px solid var(--vermillion-soft);
  padding-left: 0.6rem;
  margin: 0.3em 0;
  color: var(--ink-soft);
}
.bubble strong { font-weight: 600; }
.bubble em { font-style: italic; }

/* Fallback notice */
.fallback-notice {
  font-size: 0.65rem;
  color: var(--ink-soft);
  text-align: center;
  margin: -0.3rem 0 0.5rem;
  opacity: 0.7;
}

/* Typing indicator */
.typing { display: none; margin-bottom: 0.8rem; }
.typing.show { display: flex; }
.typing .bubble {
  background: var(--echo-bg);
  border: 1px solid rgba(44, 36, 32, 0.06);
  padding: 0.7rem 1.1rem;
}
.typing-dots {
  display: flex; gap: 4px; align-items: center;
}
.typing-dots span {
  width: 6px; height: 6px;
  background: var(--ink-soft);
  border-radius: 50%;
  animation: blink 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

/* ── Input Bar ── */
.input-bar {
  display: flex;
  align-items: flex-end;
  padding: 0.6rem 0.8rem;
  padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
  border-top: 1px solid var(--washi-dark);
  background: var(--washi);
  flex-shrink: 0;
  gap: 0.5rem;
}
.input-bar textarea {
  flex: 1;
  min-height: 38px;
  max-height: 120px;
  padding: 0.55rem 0.8rem;
  border: 1px solid var(--washi-dark);
  border-radius: 18px;
  background: var(--echo-bg);
  font-size: 0.92rem;
  font-family: var(--font-sans);
  color: var(--ink);
  resize: none;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.2s;
}
.input-bar textarea:focus { border-color: var(--vermillion-soft); }
.input-bar textarea::placeholder { color: #b5aa9e; }

.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--vermillion);
  border: none;
  color: var(--joy-text);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s, transform 0.1s;
}
.send-btn:disabled { opacity: 0.4; cursor: default; }
.send-btn:active:not(:disabled) { transform: scale(0.92); }
.send-btn svg { width: 18px; height: 18px; }

/* ── Scrollbar ── */
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--washi-dark); border-radius: 3px; }

/* ── Responsive ── */
@media (min-width: 601px) {
  #chat-app { border-left: 1px solid var(--washi-dark); border-right: 1px solid var(--washi-dark); }
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="seal">私</div>
  <h1>Echo · 私語</h1>
  <p class="sub">与 Echo 的私人对话空间</p>
  <input type="password" id="token-input" placeholder="输入访问令牌" autocomplete="off">
  <button onclick="tryAuth()">入</button>
  <div class="err" id="auth-err"></div>
</div>

<!-- Chat App -->
<div id="chat-app">
  <div class="chat-header">
    <div class="avatar">E</div>
    <span class="name">Echo</span>
    <div class="header-right">
      <span class="model-badge" id="model-badge"></span>
      <button class="new-btn" onclick="newSession()">新对话</button>
    </div>
  </div>

  <!-- Phase 1: Model + Thinking toolbar -->
  <div class="chat-toolbar">
    <div class="toolbar-group">
      <label>模型</label>
      <select class="model-select" id="model-select" onchange="onModelChange()">
        <option value="claude-opus-4-6">加载中…</option>
      </select>
    </div>
    <div class="toolbar-group toggle-wrap" onclick="toggleThinking()">
      <label>思考</label>
      <div class="toggle-track" id="thinking-toggle">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="typing" id="typing">
    <div class="bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="说点什么..." rows="1" autocomplete="off"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
const API = 'https://studio.echowjoy.uk';
let sessionId = '';
let sending = false;
let models = [];
let currentModel = localStorage.getItem('echo_chat_model') || '';
let thinkingOn = localStorage.getItem('echo_chat_thinking') === 'true';

function token() { return localStorage.getItem('studio_token') || ''; }

async function apiCall(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token()
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(e.error || r.statusText);
  }
  return r.json();
}

// ── Auth ──
async function tryAuth() {
  const input = document.getElementById('token-input');
  const err = document.getElementById('auth-err');
  const t = input.value.trim();
  if (!t) return;
  localStorage.setItem('studio_token', t);
  try {
    await apiCall('GET', '/api/ping');
    showChat();
  } catch {
    localStorage.removeItem('studio_token');
    err.textContent = '令牌无效';
  }
}

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryAuth();
});

async function showChat() {
  document.getElementById('auth-screen').style.display = 'none';
  const app = document.getElementById('chat-app');
  app.style.display = 'flex';
  await loadModels();
  initSession();
  document.getElementById('input').focus();
}

// ── Phase 1: Models ──
async function loadModels() {
  try {
    const data = await apiCall('GET', '/api/chat/models');
    models = data.models;
    const sel = document.getElementById('model-select');
    sel.innerHTML = '';
    for (const m of models) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label;
      sel.appendChild(opt);
    }
    // Restore saved model or use default
    if (currentModel && models.some(m => m.id === currentModel)) {
      sel.value = currentModel;
    } else {
      currentModel = data.default;
      sel.value = currentModel;
    }
    updateThinkingState();
  } catch (e) {
    console.error('load models failed:', e);
  }
}

function onModelChange() {
  const sel = document.getElementById('model-select');
  currentModel = sel.value;
  localStorage.setItem('echo_chat_model', currentModel);
  // Auto-set thinking based on model default
  const m = models.find(x => x.id === currentModel);
  if (m) {
    thinkingOn = m.defaultThinking;
    localStorage.setItem('echo_chat_thinking', thinkingOn);
  }
  updateThinkingState();
}

function toggleThinking() {
  const m = models.find(x => x.id === currentModel);
  if (m && !m.supportsThinking) return; // can't enable for non-thinking models
  thinkingOn = !thinkingOn;
  localStorage.setItem('echo_chat_thinking', thinkingOn);
  updateThinkingState();
}

function updateThinkingState() {
  const track = document.getElementById('thinking-toggle');
  const m = models.find(x => x.id === currentModel);
  const supported = m ? m.supportsThinking : false;
  if (!supported) {
    thinkingOn = false;
    track.classList.remove('on');
    track.parentElement.style.opacity = '0.4';
    track.parentElement.style.pointerEvents = 'none';
  } else {
    track.parentElement.style.opacity = '1';
    track.parentElement.style.pointerEvents = 'auto';
    track.classList.toggle('on', thinkingOn);
  }
}

// ── Session ──
function generateId() {
  return 'chat-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function initSession() {
  const saved = localStorage.getItem('echo_chat_session');
  if (saved) {
    sessionId = saved;
    loadHistory();
  } else {
    newSession();
  }
}

function newSession() {
  sessionId = generateId();
  localStorage.setItem('echo_chat_session', sessionId);
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  addWelcome();
}

function addWelcome() {
  const greetings = ['在呢。想聊什么？', '囡囡来了。', '嗯？', '来了来了。'];
  appendMessage('assistant', greetings[Math.floor(Math.random() * greetings.length)]);
}

async function loadHistory() {
  try {
    const data = await apiCall('GET', `/api/chat/history?session_id=${sessionId}`);
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    if (!data.messages.length) { addWelcome(); return; }
    for (const m of data.messages) appendMessage(m.role, m.content);
    scrollToBottom();
  } catch (e) {
    console.error('load history failed:', e);
    addWelcome();
  }
}

// ── Messages ──
function appendMessage(role, content) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant') {
    bubble.innerHTML = marked.parse(content, { breaks: true });
  } else {
    bubble.textContent = content;
  }
  div.appendChild(bubble);
  msgs.appendChild(div);
  scrollToBottom();
}

function showFallbackNotice(requested, actual) {
  const msgs = document.getElementById('messages');
  const notice = document.createElement('div');
  notice.className = 'fallback-notice';
  const reqLabel = models.find(m => m.id === requested)?.label || requested;
  const actLabel = models.find(m => m.id === actual)?.label || actual;
  notice.textContent = `⚡ ${reqLabel} 不可用，已切换到 ${actLabel}`;
  msgs.appendChild(notice);
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
}

// ── Send ──
async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  sending = true;
  input.value = '';
  autoResize();
  document.getElementById('send-btn').disabled = true;

  appendMessage('user', text);

  const typing = document.getElementById('typing');
  typing.classList.add('show');
  scrollToBottom();

  // Show model badge while processing
  const badge = document.getElementById('model-badge');
  const mLabel = models.find(m => m.id === currentModel)?.label || currentModel;
  badge.textContent = thinkingOn ? `${mLabel} · 思考中` : mLabel;
  badge.classList.add('show');

  try {
    const data = await apiCall('POST', '/api/chat/message', {
      session_id: sessionId,
      messages: [{ role: 'user', content: text }],
      model: currentModel,
      thinking: thinkingOn
    });
    typing.classList.remove('show');
    // Check for fallback
    if (data.actual_model && data.actual_model !== data.model) {
      showFallbackNotice(data.model, data.actual_model);
    }
    appendMessage('assistant', data.reply);
  } catch (e) {
    typing.classList.remove('show');
    appendMessage('assistant', `_（连接出了点问题：${e.message}）_`);
  } finally {
    sending = false;
    document.getElementById('send-btn').disabled = false;
    badge.classList.remove('show');
    input.focus();
  }
}

// ── Input handling ──
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');

inputEl.addEventListener('input', () => {
  sendBtn.disabled = !inputEl.value.trim();
  autoResize();
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (inputEl.value.trim()) sendMessage();
  }
});

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

// ── Init ──
marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

if (token()) {
  apiCall('GET', '/api/ping').then(() => showChat()).catch(() => {
    document.getElementById('auth-screen').style.display = 'flex';
  });
} else {
  document.getElementById('auth-screen').style.display = 'flex';
}
</script>
</body>
</html>
