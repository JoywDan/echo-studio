<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Echo · 私语</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--washi:#efe9dc;--washi-dark:#e4dccb;--ink:#27221c;--ink-soft:#5a4e46;--vermillion:#a7372a;--vermillion-soft:#c4564a;--echo-bg:#f7f3ec;--joy-bg:#a7372a;--joy-text:#faf5ef;--font-serif:'Noto Serif SC','Songti SC',serif;--font-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
html,body{height:100%;width:100%;background:var(--washi);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}

/* Auth */
#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:2rem;text-align:center}
#auth-screen .seal{width:48px;height:48px;border:2px solid var(--vermillion);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:22px;color:var(--vermillion);margin-bottom:1.5rem;transform:rotate(-4deg)}
#auth-screen h1{font-family:var(--font-serif);font-size:1.4rem;font-weight:400;letter-spacing:0.15em;margin-bottom:0.4rem}
#auth-screen .sub{font-size:0.75rem;color:var(--ink-soft);letter-spacing:0.08em;margin-bottom:2rem}
#auth-screen input{width:100%;max-width:260px;padding:0.7rem 1rem;border:1px solid var(--washi-dark);border-radius:8px;background:var(--echo-bg);font-size:0.9rem;text-align:center;letter-spacing:0.2em;color:var(--ink);outline:none}
#auth-screen input:focus{border-color:var(--vermillion-soft)}
#auth-screen button{margin-top:1rem;padding:0.6rem 2.5rem;background:var(--vermillion);color:var(--joy-text);border:none;border-radius:8px;font-size:0.85rem;cursor:pointer}
#auth-screen .err{margin-top:0.8rem;font-size:0.75rem;color:var(--vermillion)}

/* Chat */
#chat-app{display:none;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
.chat-header{display:flex;align-items:center;padding:0.55rem 0.8rem;border-bottom:1px solid var(--washi-dark);background:var(--washi);flex-shrink:0;gap:0.5rem}
.chat-header .avatar{width:30px;height:30px;border-radius:50%;background:var(--vermillion);color:var(--joy-text);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:13px;flex-shrink:0}
.chat-header .name{font-family:var(--font-serif);font-size:0.95rem;letter-spacing:0.06em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0.4rem}
.model-badge{display:none;font-size:0.62rem;padding:0.1rem 0.35rem;border-radius:3px;background:rgba(167,55,42,0.1);color:var(--vermillion)}
.model-badge.show{display:inline}
.new-btn{padding:0.25rem 0.55rem;font-size:0.65rem;color:var(--ink-soft);background:none;border:1px solid var(--washi-dark);border-radius:5px;cursor:pointer;font-family:var(--font-sans)}

/* Toolbar */
.chat-toolbar{display:flex;align-items:center;padding:0.35rem 0.8rem;border-bottom:1px solid rgba(228,220,203,0.6);background:rgba(247,243,236,0.5);flex-shrink:0;gap:0.6rem;font-size:0.72rem;color:var(--ink-soft);flex-wrap:wrap}
.toolbar-group{display:flex;align-items:center;gap:0.3rem}
.toolbar-group label{font-size:0.68rem;letter-spacing:0.03em;white-space:nowrap}
.model-select{padding:0.18rem 0.35rem;border:1px solid var(--washi-dark);border-radius:5px;background:var(--echo-bg);font-size:0.7rem;color:var(--ink);font-family:var(--font-sans);outline:none;cursor:pointer;max-width:140px}
.toggle-wrap{display:flex;align-items:center;gap:0.25rem;cursor:pointer}
.toggle-track{width:28px;height:16px;border-radius:8px;background:var(--washi-dark);position:relative;transition:background 0.2s}
.toggle-track.on{background:var(--vermillion)}
.toggle-knob{width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform 0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.15)}
.toggle-track.on .toggle-knob{transform:translateX(12px)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:1rem 0.8rem;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{display:flex;margin-bottom:0.8rem;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{justify-content:flex-end}.msg.assistant{justify-content:flex-start}
.msg-wrap{max-width:80%}
.bubble{padding:0.65rem 0.9rem;border-radius:14px;font-size:0.92rem;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:var(--joy-bg);color:var(--joy-text);border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--echo-bg);color:var(--ink);border-bottom-left-radius:4px;border:1px solid rgba(44,36,32,0.06)}
.bubble p{margin:0 0 0.4em}.bubble p:last-child{margin-bottom:0}
.bubble code{background:rgba(44,36,32,0.06);padding:0.1em 0.3em;border-radius:3px;font-size:0.85em}
.msg.user .bubble code{background:rgba(255,255,255,0.15)}
.bubble pre{background:rgba(44,36,32,0.05);padding:0.5rem;border-radius:6px;overflow-x:auto;margin:0.3em 0}
.bubble blockquote{border-left:2px solid var(--vermillion-soft);padding-left:0.6rem;margin:0.3em 0;color:var(--ink-soft)}

/* Attachments in bubbles */
.msg-images{display:flex;gap:0.3rem;flex-wrap:wrap;margin-bottom:0.3rem}
.msg-images img{max-width:180px;max-height:180px;border-radius:10px;object-fit:cover;cursor:pointer}
.msg.user .msg-images img{border:2px solid rgba(255,255,255,0.2)}

/* Tool cards */
.tool-cards{margin-top:0.4rem}
.tool-card{font-size:0.72rem;padding:0.4rem 0.6rem;border-radius:8px;background:rgba(167,55,42,0.05);border:1px solid rgba(167,55,42,0.12);margin-bottom:0.3rem;color:var(--ink-soft)}
.tool-card-header{display:flex;align-items:center;gap:0.3rem;font-weight:500;color:var(--vermillion)}
.tool-card-args{margin-top:0.2rem;font-size:0.65rem;opacity:0.8}
.tool-card-result{margin-top:0.25rem;font-size:0.65rem;max-height:60px;overflow:hidden;cursor:pointer;transition:max-height 0.3s}
.tool-card-result.expanded{max-height:400px;overflow-y:auto}
.tool-card-expand{font-size:0.6rem;color:var(--vermillion-soft);cursor:pointer;margin-top:0.15rem}
.fallback-notice{font-size:0.65rem;color:var(--ink-soft);text-align:center;margin:-0.3rem 0 0.5rem;opacity:0.7}

/* Typing */
.typing{display:none;margin-bottom:0.8rem}.typing.show{display:flex}
.typing .bubble{background:var(--echo-bg);border:1px solid rgba(44,36,32,0.06);padding:0.7rem 1.1rem}
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dots span{width:6px;height:6px;background:var(--ink-soft);border-radius:50%;animation:blink 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,60%,100%{opacity:0.3}30%{opacity:1}}

/* Input Bar */
.input-bar{display:flex;align-items:flex-end;padding:0.6rem 0.8rem;padding-bottom:max(0.6rem,env(safe-area-inset-bottom));border-top:1px solid var(--washi-dark);background:var(--washi);flex-shrink:0;gap:0.5rem}
.input-bar textarea{flex:1;min-height:38px;max-height:120px;padding:0.55rem 0.8rem;border:1px solid var(--washi-dark);border-radius:18px;background:var(--echo-bg);font-size:0.92rem;font-family:var(--font-sans);color:var(--ink);resize:none;outline:none;line-height:1.5}
.input-bar textarea:focus{border-color:var(--vermillion-soft)}
.input-bar textarea::placeholder{color:#b5aa9e}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--vermillion);border:none;color:var(--joy-text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.2s,transform 0.1s}
.send-btn:disabled{opacity:0.4;cursor:default}
.send-btn:active:not(:disabled){transform:scale(0.92)}
.send-btn svg{width:18px;height:18px}
/* Image button */
.img-btn{width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--washi-dark);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;transition:all 0.2s}
.img-btn:active{background:var(--washi-dark)}

/* Image preview */
.img-preview{display:none;padding:0.4rem 0.8rem;border-top:1px solid var(--washi-dark);background:rgba(247,243,236,0.8);flex-shrink:0}
.img-preview.show{display:flex;align-items:center;gap:0.5rem}
.img-preview img{width:50px;height:50px;object-fit:cover;border-radius:8px;border:1px solid var(--washi-dark)}
.img-preview .info{font-size:0.7rem;color:var(--ink-soft);flex:1}
.img-preview .remove{width:24px;height:24px;border-radius:50%;background:none;border:1px solid var(--washi-dark);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.7rem}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:90%;object-fit:contain;border-radius:4px}

.messages::-webkit-scrollbar{width:3px}.messages::-webkit-scrollbar-track{background:transparent}.messages::-webkit-scrollbar-thumb{background:var(--washi-dark);border-radius:3px}
@media(min-width:601px){#chat-app{border-left:1px solid var(--washi-dark);border-right:1px solid var(--washi-dark)}}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="seal">私</div><h1>Echo · 私語</h1><p class="sub">与 Echo 的私人对话空间</p>
  <input type="password" id="token-input" placeholder="输入访问令牌" autocomplete="off">
  <button onclick="tryAuth()">入</button><div class="err" id="auth-err"></div>
</div>

<div id="chat-app">
  <div class="chat-header">
    <div class="avatar">E</div><span class="name">Echo</span>
    <div class="header-right"><span class="model-badge" id="model-badge"></span><button class="new-btn" onclick="newSession()">新对话</button></div>
  </div>
  <div class="chat-toolbar">
    <div class="toolbar-group"><label>模型</label><select class="model-select" id="model-select" onchange="onModelChange()"></select></div>
    <div class="toolbar-group toggle-wrap" onclick="toggleThinking()"><label>思考</label><div class="toggle-track" id="thinking-toggle"><div class="toggle-knob"></div></div></div>
    <div class="toolbar-group toggle-wrap" onclick="toggleMemory()"><label>记忆</label><div class="toggle-track on" id="memory-toggle"><div class="toggle-knob"></div></div></div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing" id="typing"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>

  <div class="img-preview" id="img-preview">
    <img id="img-preview-thumb" src="">
    <div class="info" id="img-preview-info"></div>
    <button class="remove" onclick="clearImage()">✕</button>
  </div>

  <div class="input-bar">
    <button class="img-btn" onclick="document.getElementById('file-input').click()" title="发图片">📷</button>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" onchange="onFileSelect(event)">
    <textarea id="input" placeholder="说点什么..." rows="1" autocomplete="off"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightbox-img" src=""></div>

<script>
const API='https://studio.echowjoy.uk';
let sessionId='',sending=false,models=[];
let currentModel=localStorage.getItem('echo_chat_model')||'';
let thinkingOn=localStorage.getItem('echo_chat_thinking')==='true';
let memoryOn=localStorage.getItem('echo_chat_memory')!=='false';
let pendingImage=null; // {file, preview, uploaded:{filename,url}}

function token(){return localStorage.getItem('studio_token')||'';}
async function apiCall(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||r.statusText);}
  return r.json();
}

// Auth
async function tryAuth(){
  const inp=document.getElementById('token-input'),err=document.getElementById('auth-err');
  const t=inp.value.trim();if(!t)return;
  localStorage.setItem('studio_token',t);
  try{await apiCall('GET','/api/ping');showChat();}catch{localStorage.removeItem('studio_token');err.textContent='令牌无效';}
}
document.getElementById('token-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryAuth();});
async function showChat(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('chat-app').style.display='flex';
  await loadModels();initSession();document.getElementById('input').focus();
}

// Models
async function loadModels(){
  try{const d=await apiCall('GET','/api/chat/models');models=d.models;
    const sel=document.getElementById('model-select');sel.innerHTML='';
    for(const m of models){const o=document.createElement('option');o.value=m.id;o.textContent=m.label;sel.appendChild(o);}
    if(currentModel&&models.some(m=>m.id===currentModel))sel.value=currentModel;
    else{currentModel=d.default;sel.value=currentModel;}
    updateToggles();
  }catch(e){console.error('load models:',e);}
}
function onModelChange(){currentModel=document.getElementById('model-select').value;localStorage.setItem('echo_chat_model',currentModel);const m=models.find(x=>x.id===currentModel);if(m){thinkingOn=m.defaultThinking;localStorage.setItem('echo_chat_thinking',thinkingOn);}updateToggles();}
function toggleThinking(){const m=models.find(x=>x.id===currentModel);if(m&&!m.supportsThinking)return;thinkingOn=!thinkingOn;localStorage.setItem('echo_chat_thinking',thinkingOn);updateToggles();}
function toggleMemory(){memoryOn=!memoryOn;localStorage.setItem('echo_chat_memory',memoryOn);updateToggles();}
function updateToggles(){
  const tt=document.getElementById('thinking-toggle'),mt=document.getElementById('memory-toggle');
  const m=models.find(x=>x.id===currentModel);const s=m?m.supportsThinking:false;
  if(!s){thinkingOn=false;tt.classList.remove('on');tt.parentElement.style.opacity='0.4';tt.parentElement.style.pointerEvents='none';}
  else{tt.parentElement.style.opacity='1';tt.parentElement.style.pointerEvents='auto';tt.classList.toggle('on',thinkingOn);}
  mt.classList.toggle('on',memoryOn);
}

// Session
function genId(){return'chat-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function initSession(){const s=localStorage.getItem('echo_chat_session');if(s){sessionId=s;loadHistory();}else newSession();}
function newSession(){sessionId=genId();localStorage.setItem('echo_chat_session',sessionId);document.getElementById('messages').innerHTML='';addWelcome();clearImage();}
function addWelcome(){const g=['在呢。想聊什么？','囡囡来了。','嗯？','来了来了。'];appendMessage('assistant',g[Math.floor(Math.random()*g.length)]);}
async function loadHistory(){
  try{const d=await apiCall('GET',`/api/chat/history?session_id=${sessionId}`);
    document.getElementById('messages').innerHTML='';
    if(!d.messages.length){addWelcome();return;}
    for(const m of d.messages){
      const att=m.attachments_json?JSON.parse(m.attachments_json):null;
      appendMessage(m.role,m.content,null,att);
    }
    scrollToBottom();
  }catch{addWelcome();}
}

// Image handling
function onFileSelect(e){const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('图片太大，最大5MB');return;}previewImage(f);e.target.value='';}
function previewImage(file){
  pendingImage={file,preview:URL.createObjectURL(file),uploaded:null};
  document.getElementById('img-preview-thumb').src=pendingImage.preview;
  document.getElementById('img-preview-info').textContent=`${file.name} (${(file.size/1024).toFixed(0)}KB)`;
  document.getElementById('img-preview').classList.add('show');
  updateSendBtn();
}
function clearImage(){
  if(pendingImage?.preview)URL.revokeObjectURL(pendingImage.preview);
  pendingImage=null;
  document.getElementById('img-preview').classList.remove('show');
  updateSendBtn();
}
async function uploadImage(file){
  const r=await fetch(API+'/api/chat/upload-image',{
    method:'POST',headers:{'Authorization':'Bearer '+token(),'Content-Type':file.type},
    body:file
  });
  if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||'upload failed');}
  return r.json();
}
// Paste handler
document.addEventListener('paste',e=>{
  const items=e.clipboardData?.items;if(!items)return;
  for(const item of items){
    if(item.type.startsWith('image/')){
      e.preventDefault();
      const f=item.getAsFile();if(f&&f.size<=5*1024*1024)previewImage(f);
      else if(f)alert('图片太大，最大5MB');
      break;
    }
  }
});

// Messages
function appendMessage(role,content,toolCalls,attachments){
  const msgs=document.getElementById('messages');const div=document.createElement('div');div.className=`msg ${role}`;
  const wrap=document.createElement('div');wrap.className='msg-wrap';
  // Images
  if(attachments&&attachments.length){
    const imgDiv=document.createElement('div');imgDiv.className='msg-images';
    for(const a of attachments){
      const img=document.createElement('img');
      img.src=API+(a.url||`/api/chat/uploads/${a.filename}`);
      img.onclick=()=>{document.getElementById('lightbox-img').src=img.src;document.getElementById('lightbox').classList.add('show');};
      imgDiv.appendChild(img);
    }
    wrap.appendChild(imgDiv);
  }
  const bubble=document.createElement('div');bubble.className='bubble';
  if(role==='assistant')bubble.innerHTML=marked.parse(content,{breaks:true});else bubble.textContent=content;
  wrap.appendChild(bubble);
  if(toolCalls&&toolCalls.length){
    const cards=document.createElement('div');cards.className='tool-cards';
    for(const tc of toolCalls){
      const card=document.createElement('div');card.className='tool-card';
      const labels={memory_search:'🔍 记忆搜索',memory_recent:'📋 最近记忆',memory_write:'✏️ 写入记忆',memory_wakeup:'🌅 记忆唤醒'};
      card.innerHTML=`<div class="tool-card-header">${labels[tc.tool]||tc.tool}</div>`
        +(tc.args?`<div class="tool-card-args">${formatArgs(tc.args)}</div>`:'')
        +(tc.result?`<div class="tool-card-result" onclick="this.classList.toggle('expanded')">${escHtml(tc.result.slice(0,200))}${tc.result.length>200?'…':''}</div>`:'');
      cards.appendChild(card);
    }
    wrap.appendChild(cards);
  }
  div.appendChild(wrap);msgs.appendChild(div);scrollToBottom();
}
function formatArgs(a){return Object.entries(a).map(([k,v])=>`${k}: ${typeof v==='string'?v:JSON.stringify(v)}`).join(' · ');}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showFallbackNotice(req,act){
  const msgs=document.getElementById('messages');const n=document.createElement('div');n.className='fallback-notice';
  n.textContent=`⚡ ${models.find(m=>m.id===req)?.label||req} 不可用，已切换到 ${models.find(m=>m.id===act)?.label||act}`;msgs.appendChild(n);
}
function scrollToBottom(){const m=document.getElementById('messages');requestAnimationFrame(()=>{m.scrollTop=m.scrollHeight;});}
function updateSendBtn(){document.getElementById('send-btn').disabled=!(document.getElementById('input').value.trim()||pendingImage);}

// Send
async function sendMessage(){
  if(sending)return;
  const inp=document.getElementById('input');const text=inp.value.trim();
  if(!text&&!pendingImage)return;
  sending=true;inp.value='';autoResize();document.getElementById('send-btn').disabled=true;

  let attachments=[];
  // Upload image first if pending
  if(pendingImage){
    const badge=document.getElementById('model-badge');badge.textContent='上传图片…';badge.classList.add('show');
    try{
      const up=await uploadImage(pendingImage.file);
      attachments=[{filename:up.filename,url:up.url}];
    }catch(e){
      appendMessage('assistant',`_（图片上传失败：${e.message}）_`);
      sending=false;document.getElementById('send-btn').disabled=false;clearImage();return;
    }
    clearImage();
  }

  appendMessage('user',text||'[图片]',null,attachments.length?attachments:null);
  document.getElementById('typing').classList.add('show');scrollToBottom();
  const badge=document.getElementById('model-badge');badge.textContent=thinkingOn?'思考中…':'';if(badge.textContent)badge.classList.add('show');

  try{
    const d=await apiCall('POST','/api/chat/message',{
      session_id:sessionId,messages:[{role:'user',content:text||'[发了一张图片]'}],
      model:currentModel,thinking:thinkingOn,tools:memoryOn,
      attachments:attachments.length?attachments:undefined
    });
    document.getElementById('typing').classList.remove('show');
    if(d.actual_model&&d.actual_model!==d.model)showFallbackNotice(d.model,d.actual_model);
    appendMessage('assistant',d.reply,d.tool_calls);
  }catch(e){
    document.getElementById('typing').classList.remove('show');
    appendMessage('assistant',`_（连接出了点问题：${e.message}）_`);
  }finally{sending=false;updateSendBtn();badge.classList.remove('show');inp.focus();}
}

// Input
const inputEl=document.getElementById('input');
inputEl.addEventListener('input',()=>{updateSendBtn();autoResize();});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(inputEl.value.trim()||pendingImage)sendMessage();}});
function autoResize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px';}

// Init
marked.setOptions({breaks:true,gfm:true,headerIds:false,mangle:false});
if(token())apiCall('GET','/api/ping').then(()=>showChat()).catch(()=>{document.getElementById('auth-screen').style.display='flex';});
else document.getElementById('auth-screen').style.display='flex';
</script>
</body>
</html>
