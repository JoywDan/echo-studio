<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        if (location.hostname === 'joywdan.github.io') {
          location.replace('https://studio.echowjoy.uk' + location.pathname + location.search + location.hash)
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Echo Studio" />
    <link rel="manifest" href="/echo-studio/manifest.json" />
    <link rel="apple-touch-icon" href="/echo-studio/icon-192.png" />
    <title>Echo Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
// SW 更新即自动重载一次 (2026-06-11): 新版本激活后页面自己换新, 不用手动杀PWA
if ('serviceWorker' in navigator) {
  let reloaded = false
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return; reloaded = true; location.reload()
  })
}
</script>
</body>
</html>
